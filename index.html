<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>相互評価レーダー</title>

<!-- ホーム画面に追加したときにアプリとして開くための設定 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="評価レーダー">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  color-scheme: light;
  --plane:#eceff3;
  --surface:#fbfcfd;
  --surface-2:#f2f5f8;
  --surface-3:#e6eaef;
  --ink:#10151a;
  --ink-2:#4a5560;
  --ink-muted:#79838d;
  --grid:#e0e5ea;
  --axis:#c2cad2;
  --line:rgba(16,21,26,.10);
  --line-strong:rgba(16,21,26,.18);
  --accent:#2a78d6;
  --accent-ink:#ffffff;
  --accent-soft:rgba(42,120,214,.10);
  --accent-soft-2:rgba(42,120,214,.20);
  --s1:#2a78d6;
  --s2:#eb6834;
  --s3:#1baf7a;
  --good:#0ca30c;
  --warn:#fab219;
  --crit:#d03b3b;
  --shadow:0 1px 2px rgba(16,21,26,.05), 0 8px 24px -16px rgba(16,21,26,.30);

  --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --r:6px;
  --r-sm:3px;
  --maxw:1000px;
  --topbar-h:58px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0e1114;
    --surface:#171a1d;
    --surface-2:#1e2226;
    --surface-3:#262b30;
    --ink:#ffffff;
    --ink-2:#c0c7cf;
    --ink-muted:#8b939c;
    --grid:#262b30;
    --axis:#3a4149;
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.20);
    --accent:#3987e5;
    --accent-ink:#0b0f13;
    --accent-soft:rgba(57,135,229,.16);
    --accent-soft-2:rgba(57,135,229,.28);
    --s1:#3987e5;
    --s2:#d95926;
    --s3:#199e70;
    --shadow:0 1px 2px rgba(0,0,0,.40), 0 8px 24px -16px rgba(0,0,0,.80);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e1114;
  --surface:#171a1d;
  --surface-2:#1e2226;
  --surface-3:#262b30;
  --ink:#ffffff;
  --ink-2:#c0c7cf;
  --ink-muted:#8b939c;
  --grid:#262b30;
  --axis:#3a4149;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.20);
  --accent:#3987e5;
  --accent-ink:#0b0f13;
  --accent-soft:rgba(57,135,229,.16);
  --accent-soft-2:rgba(57,135,229,.28);
  --s1:#3987e5;
  --s2:#d95926;
  --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.40), 0 8px 24px -16px rgba(0,0,0,.80);
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.3;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
a{color:var(--accent)}

.app{
  max-width:var(--maxw);margin:0 auto;
  padding:0 calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom))
            calc(16px + env(safe-area-inset-left));
}

/* ============================================================
   Top bar
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
  margin:0 0 24px;
  /* 全画面起動時にステータスバー（ノッチ）と重ならないようにする */
  padding:env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) 0
          calc(16px + env(safe-area-inset-left));
}
.topbar-in{
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;gap:16px;
  min-height:58px;flex-wrap:wrap;padding:8px 0;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.brand svg{display:block;color:var(--accent)}
.brand-name{font-weight:800;letter-spacing:-.02em;font-size:15px}
.brand-sub{
  font-family:var(--font-data);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-muted);
}
.tabs{display:flex;gap:2px;background:var(--surface-3);padding:3px;border-radius:var(--r)}
.tab{
  padding:6px 14px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;
  color:var(--ink-2);transition:background .14s, color .14s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ============================================================
   Building blocks
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);
}
.pad{padding:20px}
.stack{display:flex;flex-direction:column}
.g8{gap:8px} .g12{gap:12px} .g16{gap:16px} .g24{gap:24px} .g32{gap:32px} .g40{gap:40px}
.row{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.eyebrow{
  font-family:var(--font-data);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-muted);font-weight:600;
}
.muted{color:var(--ink-muted)}
.dim{color:var(--ink-2)}
.small{font-size:13px}
.xsmall{font-size:12px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 18px;border-radius:var(--r);font-size:14px;font-weight:650;
  background:var(--surface-3);color:var(--ink);
  border:1px solid transparent;transition:background .14s,transform .06s,opacity .14s;
}
.btn:hover{background:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface-3);filter:none}

.field{
  width:100%;padding:10px 12px;background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:var(--r);
  font-family:var(--font-data);font-size:14px;
}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.field{line-height:1.6;resize:vertical;min-height:92px}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;font-size:12px;font-weight:650;
  background:var(--surface-3);color:var(--ink-2);
}
.pill-on{background:var(--accent-soft);color:var(--accent)}
.pill-done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill-crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.notice{
  padding:12px 14px;border-radius:var(--r);font-size:13.5px;line-height:1.6;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.notice-warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.notice-crit{background:color-mix(in srgb,var(--crit) 10%,var(--surface));border-color:color-mix(in srgb,var(--crit) 40%,transparent);color:var(--ink)}

/* ============================================================
   Section headers
   ============================================================ */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-head h2{font-size:19px}
.sec-note{font-size:13px;color:var(--ink-muted);max-width:56ch;line-height:1.6}

/* ============================================================
   Answer: evaluator picker
   ============================================================ */
.hero-lede{max-width:62ch;font-size:15.5px;color:var(--ink-2);line-height:1.75}
.rulebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.rulebox > div{background:var(--surface);padding:14px 16px}
.rule-k{font-family:var(--font-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);font-weight:600}
.rule-v{font-size:14px;line-height:1.55;margin-top:4px}

.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.who{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:14px 16px;border-radius:var(--r);text-align:left;
  background:var(--surface);border:1px solid var(--line-strong);
  transition:border-color .14s,background .14s,transform .06s;
}
.who:hover{border-color:var(--accent);background:var(--accent-soft)}
.who:active{transform:translateY(1px)}
.who-name{font-size:18px;font-weight:750;letter-spacing:-.01em}
.who-state{font-size:11.5px;font-family:var(--font-data);color:var(--ink-muted)}
.who[data-done="1"]{border-style:dashed;opacity:.72}

/* ============================================================
   Answer: questionnaire
   ============================================================ */
.qbar{
  position:sticky;top:var(--topbar-h);z-index:30;
  background:color-mix(in srgb, var(--plane) 92%, transparent);
  backdrop-filter:blur(8px);
  margin:0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
  padding:10px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  border-bottom:1px solid var(--line);
}
.qbar-in{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.progress{height:3px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.catrail{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.catrail button{
  flex:none;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
  color:var(--ink-muted);border:1px solid transparent;white-space:nowrap;
}
.catrail button:hover{color:var(--ink);background:var(--surface-2)}
.catrail button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.catrail button[data-full="1"]:not([aria-current="true"]){color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qcard + .qcard{margin-top:10px}
.qcard-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
.qno{font-family:var(--font-data);font-size:11px;color:var(--ink-muted);font-weight:650;letter-spacing:.06em;flex:none}
.qtext{font-size:16px;font-weight:700;letter-spacing:-.01em}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:0 16px 14px}
.chip{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:var(--r);text-align:left;
  background:var(--surface-2);border:1px solid var(--line);
  transition:border-color .14s,background .14s,transform .12s cubic-bezier(.2,.9,.3,1.4);
}
.chip:hover{border-color:var(--line-strong)}
.chip-name{font-size:15px;font-weight:650}
.chip-rank{
  flex:none;width:26px;height:26px;border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-family:var(--font-data);font-size:12px;font-weight:700;
  background:var(--surface-3);color:var(--ink-muted);
}
.chip[data-ranked="1"]{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-1px)}
.chip[data-ranked="1"] .chip-rank{background:var(--accent);color:var(--accent-ink)}
.chip-pt{margin-left:auto;font-family:var(--font-data);font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.chip[data-ranked="1"] .chip-pt{color:var(--accent);font-weight:700}
.qfoot{display:flex;align-items:center;gap:10px;padding:0 16px 12px}

/* amber only for "started but unfinished" — an untouched card is just neutral */
.qcard[data-state="partial"]{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.qcard[data-state="done"]{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}

.qnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ============================================================
   Answer: done
   ============================================================ */
.codebox{
  font-family:var(--font-data);font-size:15px;letter-spacing:.06em;
  word-break:break-all;line-height:1.9;
  padding:16px;border-radius:var(--r);
  background:var(--surface-2);border:1px dashed var(--line-strong);
}

/* ============================================================
   Results
   ============================================================ */
.lock{max-width:420px}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:720px){ .hero{grid-template-columns:minmax(220px,300px) minmax(0,1fr)} }
.hero-fig{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero-name{font-size:30px;font-weight:800;letter-spacing:-.02em}

.rank-list{display:flex;flex-direction:column;gap:2px}
.rank-row{display:grid;grid-template-columns:34px minmax(72px,auto) minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 0}
.rank-row + .rank-row{border-top:1px solid var(--line)}
.rank-badge{
  width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-family:var(--font-data);font-size:12px;font-weight:700;
  background:var(--surface-3);color:var(--ink-2);
}
.rank-badge[data-top="1"]{background:var(--accent);color:var(--accent-ink)}
.rank-name{font-size:14.5px;font-weight:650;white-space:nowrap}
.bar-track{height:10px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar-fill{
  height:100%;background:var(--s1);
  border-top-right-radius:4px;border-bottom-right-radius:4px;
  transition:width .4s cubic-bezier(.2,.7,.3,1);
}
.rank-val{font-family:var(--font-data);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.rank-val b{color:var(--ink);font-weight:700}

.radar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.radar-cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.radar-cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 8px 4px}
.radar-cap .n{font-size:15px;font-weight:750}
.radar-cap .v{font-family:var(--font-data);font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.radar-svg{display:block;width:100%;height:auto}

.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.legend-item{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.legend-swatch{width:22px;height:0;border-top:2px solid currentColor;position:relative;flex:none}
.legend-swatch::after{
  content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:9px;height:9px;background:currentColor;
  box-shadow:0 0 0 2px var(--surface);
}
.legend-swatch[data-shape="circle"]::after{border-radius:50%}
.legend-swatch[data-shape="square"]::after{border-radius:1px}
.legend-swatch[data-shape="diamond"]::after{rotate:45deg;border-radius:1px}

.pick-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{
  display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line-strong);font-size:13.5px;font-weight:650;color:var(--ink-2);
  transition:border-color .14s,color .14s,background .14s;
}
.pick:hover{color:var(--ink)}
.pick[aria-pressed="true"]{border-color:currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.pick:disabled{opacity:.35;cursor:not-allowed}

.cmp-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:860px){ .cmp-layout{grid-template-columns:minmax(300px,440px) minmax(0,1fr)} }
.cmp-chart{display:flex;flex-direction:column;gap:14px;min-width:0}

table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th,table.data td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data thead th{
  font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-muted);font-weight:650;border-bottom:1px solid var(--line-strong);
  position:sticky;top:0;background:var(--surface);
}
table.data td.n{font-family:var(--font-data);font-variant-numeric:tabular-nums}
table.data td.top{font-weight:750;color:var(--ink)}
table.data tbody tr:hover{background:var(--surface-2)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

details.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.qgroup + details.qgroup{margin-top:8px}
details.qgroup > summary{
  list-style:none;cursor:pointer;padding:13px 16px;
  display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;
}
details.qgroup > summary::-webkit-details-marker{display:none}
details.qgroup > summary::before{
  content:"";width:0;height:0;flex:none;
  border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;
  color:var(--ink-muted);transition:rotate .18s;
}
details.qgroup[open] > summary::before{rotate:90deg}
details.qgroup > summary:hover{background:var(--surface-2)}
.qgroup-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:18px}
.qblock-title{font-size:14px;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.qblock-title .qno{margin-right:8px}

.tip{
  position:fixed;z-index:80;pointer-events:none;opacity:0;
  transform:translate(-50%,-100%);
  padding:6px 10px;border-radius:var(--r-sm);
  background:var(--ink);color:var(--surface);
  font-size:12px;font-weight:600;white-space:nowrap;
  font-variant-numeric:tabular-nums;
  transition:opacity .12s;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.tip[data-on="1"]{opacity:1}

.hidden{display:none !important}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media print{
  .topbar,.qbar,.no-print{display:none !important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <polygon points="12,2 18.3,4.3 22,9.8 21,16.6 15.8,21.2 9.2,22 3.6,18.3 1.4,12 3.6,5.7 9.2,2" stroke="currentColor" stroke-width="1.1" opacity=".35"/>
        <polygon points="12,6.4 15.8,8 19,12.4 16.5,16.8 12.6,18.4 9.4,16.6 6.2,13.4 7.4,9 10,7.2" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <div>
        <div class="brand-name">相互評価レーダー</div>
        <div class="brand-sub" id="brand-sub">60 questions</div>
      </div>
    </div>
    <div class="tabs" role="tablist">

var NQ = QUESTIONS.length;      // 60
var PER_CAT = 6;

var MIN_PEOPLE = 3;             // 2人だと順位に意味がない

/* ============================================================
   自動集計の設定
   ------------------------------------------------------------
   Google Apps Script のウェブアプリURLをここに貼ると、参加者名簿と

   ============================================================ */
var SYNC_URL = "";

/* ============================================================
   2. Roster — 参加者と配点。ここから先はすべてこれに従う
   ============================================================ */

var ROSTER = null;   // { names:[...], scale:"double"|"linear", id:"ABCD" }

function nPeople(){ return ROSTER ? ROSTER.names.length : 0; }

/* 配点。既定の「倍々」は、4人を並べるとき 4/2/1/0 になる方式 */
function scaleFor(m, mode){
  var pts = [], i;
  if(mode === "linear"){
    for(i=0;i<m;i++) pts.push(m - 1 - i);            // 3,2,1,0

    for(i=0;i<m;i++) pts.push(i === m - 1 ? 0 : Math.pow(2, m - 2 - i));   // 4,2,1,0

}
var PTS = [];        // 順位ごとの得点
var PTS_SUM = 0;     // 評価者1人が1問で配る合計

var BASELINE = 0;    // 評価者1人あたりの平均点＝レーダーの基準

function applyRoster(r){

}

/* 評価者 e が順位をつける相手（自分以外を番号順に） */
function targets(e){

/* ============================================================
   3. SHA-256（依存なし。crypto.subtle は file:// で使えないため）
   ============================================================ */

var SHA_K = [
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }

function utf8Bytes(str){
  var bytes = [], i, c;
  for(i=0;i<str.length;i++){
    c = str.charCodeAt(i);
    if(c < 0x80){ bytes.push(c); }
    else if(c < 0x800){ bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
    else if(c < 0xd800 || c >= 0xe000){ bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    else {
      i++;
      var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
      bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    }
  }
  return bytes;
}
function bytesToStr(bytes){
  return decodeURIComponent(bytes.map(function(b){
    return "%" + ("0" + b.toString(16)).slice(-2);
  }).join(""));
}

function sha256(str){
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = utf8Bytes(str);
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  bytes.push(0, 0, 0, 0, (bitLen >>> 24) & 255, (bitLen >>> 16) & 255, (bitLen >>> 8) & 255, bitLen & 255);

  var w = new Array(64), off, t, i;
  for(off=0; off<bytes.length; off+=64){
    for(t=0;t<16;t++){
      w[t] = (bytes[off+t*4] << 24) | (bytes[off+t*4+1] << 16) | (bytes[off+t*4+2] << 8) | bytes[off+t*4+3];
    }
    for(t=16;t<64;t++){
      var s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15] >>> 3);
      var s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    var a=H[0], b=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], hh=H[7];
    for(t=0;t<64;t++){
      var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (hh + S1 + ch + SHA_K[t] + w[t]) | 0;
      var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + maj) | 0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+hh)|0;
  }
  var hex = "";
  for(i=0;i<8;i++){ hex += ("00000000" + (H[i] >>> 0).toString(16)).slice(-8); }
  return hex;
}

function deriveAuth(rosterId, person, pw){
  var h = sha256("pr2|auth|" + rosterId + "|" + person + "|" + pw);
  for(var i=0;i<3000;i++){ h = sha256(h + "|pr2"); }
  return h;
}
function deriveKey(rosterId, person, pw){
  var h = sha256("pr2|key|" + rosterId + "|" + person + "|" + pw);
  for(var i=0;i<3000;i++){ h = sha256(h + "|key"); }
  return h;
}
function resultToken(){ return sha256("pr2|read|" + PASSWORD); }

function keystream(seedHex, n){
  var out = [], block = seedHex;
  while(out.length < n){
    block = sha256(block + "|ks");
    for(var i=0;i<64 && out.length<n;i+=2){ out.push(parseInt(block.substr(i,2), 16)); }
  }
  return out;
}
var DRAFT_TAG = "PR2DRAFT:";
function encryptStr(plain, keyHex){
  var bytes = utf8Bytes(DRAFT_TAG + plain);
  var ks = keystream(keyHex, bytes.length), chars = "";
  for(var i=0;i<bytes.length;i++){ chars += String.fromCharCode(bytes[i] ^ ks[i]); }
  return btoa(chars);
}
function decryptStr(b64, keyHex){
  try{
    var chars = atob(b64);
    var ks = keystream(keyHex, chars.length), bytes = [];
    for(var i=0;i<chars.length;i++){ bytes.push(chars.charCodeAt(i) ^ ks[i]); }
    var s = bytesToStr(bytes);
    if(s.indexOf(DRAFT_TAG) !== 0) return null;
    return s.slice(DRAFT_TAG.length);
  }catch(e){ return null; }
}

/* ============================================================
   4. 回答コード
   ------------------------------------------------------------
   "PR2" + 名簿ID(4) + 回答者番号(2) + 本文 + チェックサム(2)
   本文は1問ごとに、m人の並べ方 m! 通りを24進数で表したもの。
   1問あたりの文字数は人数で変わります（4人なら1文字）。
   ============================================================ */

var ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ";   // 24文字。I と O は 1/0 と紛らわしいので除外
var PREFIX = "PR2";

function factorial(n){ var r = 1; for(var i=2;i<=n;i++) r *= i; return r; }
function charsPerQ(m){
  var need = factorial(m), w = 1;
  while(Math.pow(24, w) < need) w++;
  return w;
}
function toBase24(n, width){
  var s = "";
  for(var i=0;i<width;i++){ s = ALPHA.charAt(n % 24) + s; n = Math.floor(n / 24); }
  return s;
}
function fromBase24(s){
  var n = 0;
  for(var i=0;i<s.length;i++){
    var v = ALPHA.indexOf(s.charAt(i));
    if(v < 0) return -1;
    n = n * 24 + v;
  }
  return n;
}
function permToIndex(perm, m){
  var avail = [], idx = 0, i;
  for(i=0;i<m;i++) avail.push(i);
  for(i=0;i<m;i++){
    var p = avail.indexOf(perm[i]);
    if(p < 0) return -1;
    idx = idx * (m - i) + p;
    avail.splice(p, 1);
  }
  return idx;
}
function indexToPerm(idx, m){
  var avail = [], digits = [], out = [], x = idx, i;
  for(i=0;i<m;i++) avail.push(i);
  for(i=m-1;i>=0;i--){ var r = m - i; digits[i] = x % r; x = Math.floor(x / r); }
  for(i=0;i<m;i++) out.push(avail.splice(digits[i], 1)[0]);
  return out;
}
function checksum(s){
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = (((h * 33) ^ s.charCodeAt(i)) >>> 0); }
  var v = h % (24 * 24);
  return ALPHA.charAt(Math.floor(v / 24)) + ALPHA.charAt(v % 24);
}
function rosterFingerprint(names, scale){
  var h = sha256("pr2|roster|" + scale + "|" + names.join("␀"));
  var out = "";
  for(var i=0;i<4;i++){ out += ALPHA.charAt(parseInt(h.substr(i*2, 2), 16) % 24); }
  return out;
}
function codeLength(m){ return PREFIX.length + 4 + 2 + NQ * charsPerQ(m) + 2; }

function encodeCode(evaluator, answers){
  var m = nRanked(), w = charsPerQ(m), body = "";
  for(var q=0;q<NQ;q++){ body += toBase24(permToIndex(answers[q], m), w); }
  var core = PREFIX + ROSTER.id + toBase24(evaluator, 2) + body;
  return core + checksum(core);
}
function groupCode(code){ return (code.match(/.{1,11}/g) || []).join(" "); }

function decodeCode(raw){
  if(!ROSTER) return { error:"参加者が設定されていません。" };
  var s = String(raw || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if(!s) return { error:"空の入力です。" };
  if(s.indexOf(PREFIX) !== 0) return { error:"形式が違います（PR2 で始まる必要があります）。" };

  var m = nRanked(), w = charsPerQ(m), want = codeLength(m);
  if(s.length !== want){
    return { error:"文字数が合いません（" + s.length + "文字／この人数なら" + want + "文字）。" +
                   "参加者の設定が違う可能性があります。" };
  }
  var rid = s.substr(3, 4);
  if(rid !== ROSTER.id){
    return { error:"別の参加者設定で作られたコードです。名簿を合わせてください。" };
  }
  var evaluator = fromBase24(s.substr(7, 2));
  if(!(evaluator >= 0 && evaluator < nPeople())) return { error:"回答者の識別子が不正です。" };

  var body = s.substr(9, NQ * w);
  var core = s.substring(0, 9 + NQ * w);
  if(checksum(core) !== s.substring(9 + NQ * w)){
    return { error:"チェックサムが一致しません。コピーミスの可能性があります。" };
  }
  var answers = [], limit = factorial(m);
  for(var q=0;q<NQ;q++){
    var v = fromBase24(body.substr(q * w, w));
    if(v < 0 || v >= limit) return { error:"読み取れない文字が含まれています。" };
    answers.push(indexToPerm(v, m));
  }
  return { evaluator:evaluator, answers:answers, code:s };
}

/* ============================================================
   5. Storage — 名簿ごとに分けて保存する
   ============================================================ */

var K_ROSTER = "pr2.roster";
var K_UNLOCK = "pr2.unlocked";
function kDraft(e){ return "pr2." + ROSTER.id + ".draft." + e; }
function kAuth(e){  return "pr2." + ROSTER.id + ".auth." + e; }
function kCodes(){  return "pr2." + ROSTER.id + ".codes"; }

function lsGet(k, fallback){
  try{ var v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function getCodes(){ var c = lsGet(kCodes(), {}); return (c && typeof c === "object") ? c : {}; }
function saveCode(e, code){ var c = getCodes(); c[e] = code; lsSet(kCodes(), c); }

/* ============================================================
   6. 名簿の共有（URL・サーバー）
   ============================================================ */

function b64url(str){
  var bytes = utf8Bytes(str), s = "";
  for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(b64){
  try{
    var s = b64.replace(/-/g, "+").replace(/_/g, "/");
    while(s.length % 4) s += "=";
    var chars = atob(s), bytes = [];
    for(var i=0;i<chars.length;i++) bytes.push(chars.charCodeAt(i));
    return bytesToStr(bytes);
  }catch(e){ return null; }
}
function makeRoster(names, scale){
  return { names:names.slice(), scale:scale, id:rosterFingerprint(names, scale) };
}
function rosterLink(){
  var payload = b64url(JSON.stringify({ n:ROSTER.names, s:ROSTER.scale }));
  return location.href.split("#")[0] + "#r=" + payload;
}
function rosterFromHash(){
  var m = /[#&]r=([A-Za-z0-9\-_]+)/.exec(location.hash || "");
  if(!m) return null;
  var json = unb64url(m[1]);
  if(!json) return null;
  try{
    var o = JSON.parse(json);
    var err = validateNames(o.n);
    if(err) return null;
    return makeRoster(o.n, o.s === "linear" ? "linear" : "double");
  }catch(e){ return null; }
}
function validateNames(names){
  if(!Array.isArray(names)) return "名前のリストが読めません。";
  var clean = names.map(function(s){ return String(s == null ? "" : s).trim(); }).filter(Boolean);
  if(clean.length !== names.length) return "空の行があります。";
  if(clean.length < MIN_PEOPLE) return "参加者は" + MIN_PEOPLE + "人以上にしてください（今は" + clean.length + "人）。";
  if(clean.length > MAX_PEOPLE) return "参加者は" + MAX_PEOPLE + "人までです（今は" + clean.length + "人）。";
  for(var i=0;i<clean.length;i++){
    if(clean[i].length > MAX_NAME) return "「" + clean[i].slice(0, MAX_NAME) + "…」が長すぎます（" + MAX_NAME + "文字まで）。";
  }
  var seen = {};
  for(i=0;i<clean.length;i++){
    if(seen[clean[i]]) return "「" + clean[i] + "」が重複しています。";
    seen[clean[i]] = 1;
  }
  return null;
}

/* ============================================================
   7. 自動集計（Google Apps Script）
   ------------------------------------------------------------
   Content-Type を text/plain にしているのは、プリフライト（OPTIONS）
   を発生させないためです。Apps Script は OPTIONS に応答できません。
   ============================================================ */

function syncOn(){ return !!SYNC_URL; }

function syncCall(payload){
  if(!SYNC_URL) return Promise.reject(new Error("not_configured"));
  return fetch(SYNC_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
    redirect: "follow"
  }).then(function(res){
    if(!res.ok) throw new Error("http_" + res.status);
    return res.json();
  }).then(function(data){
    if(!data || data.ok !== true) throw new Error((data && data.error) || "server_error");
    return data;
  });
}
function syncGetRoster(){ return syncCall({ action:"getRoster" }); }
function syncSetRoster(){
  return syncCall({ action:"setRoster", key:resultToken(),
                    names:ROSTER.names, scale:ROSTER.scale, rosterId:ROSTER.id });
}
function syncSubmit(person, code, auth){
  return syncCall({ action:"submit", rosterId:ROSTER.id, person:person, code:code, auth:auth });
}
function syncStatus(){ return syncCall({ action:"status", rosterId:ROSTER.id }); }
function syncCheck(person, auth){
  return syncCall({ action:"check", rosterId:ROSTER.id, person:person, auth:auth });
}
function syncList(){ return syncCall({ action:"list", rosterId:ROSTER.id, key:resultToken() }); }
function syncReset(person){
  return syncCall({ action:"reset", rosterId:ROSTER.id, person:person, key:resultToken() });
}

function syncErrorText(err){
  var m = String((err && err.message) || err);
  if(m === "auth_mismatch")  return "パスワードが一致しません。この名前はすでに別のパスワードで登録されています。";
  if(m === "bad_key")        return "結果パスワードがサーバー側の設定と一致しません。";
  if(m === "bad_code")       return "回答データの形式がサーバーに拒否されました。";
  if(m === "roster_mismatch")return "サーバー側の参加者設定と食い違っています。名簿を設定しなおしてください。";
  if(m === "no_roster")      return "サーバーに参加者が登録されていません。";
  if(m === "not_configured") return "自動集計が設定されていません。";
  if(m.indexOf("http_") === 0) return "サーバーがエラーを返しました（" + m.slice(5) + "）。";
  return "サーバーに接続できませんでした。通信環境を確認してください。";
}

/* ============================================================
   8. 集計
   ============================================================ */

function aggregate(codes){
  var submitted = [];
  Object.keys(codes).forEach(function(k){
    var d = decodeCode(codes[k]);
    if(!d.error) submitted.push(d);
  });
  submitted.sort(function(a,b){ return a.evaluator - b.evaluator; });

  var P = nPeople(), m = nRanked();
  var raw = [], voters = [], p, q;
  for(p=0;p<P;p++){ raw[p] = new Array(NQ).fill(0); voters[p] = 0; }

  submitted.forEach(function(sub){
    var tg = targets(sub.evaluator);
    tg.forEach(function(person){ voters[person] += 1; });
    for(q=0;q<NQ;q++){
      var perm = sub.answers[q];
      for(var rank=0; rank<m; rank++){
        raw[tg[perm[rank]]][q] += PTS[rank];
      }
    }
  });

  /* avg[p][q] = 評価者1人あたりの得点（0〜MAXPT） */
  var avg = [];
  for(p=0;p<P;p++){
    avg[p] = new Array(NQ).fill(0);
    if(voters[p] > 0){
      for(q=0;q<NQ;q++){ avg[p][q] = raw[p][q] / voters[p]; }
    }
  }
  var cat = [];
  for(p=0;p<P;p++){
    cat[p] = CATS.map(function(c, ci){
      var s = 0;
      for(var i=0;i<PER_CAT;i++){ s += avg[p][ci * PER_CAT + i]; }
      return s / PER_CAT;
    });
  }
  var overall = [];
  for(p=0;p<P;p++){
    var s = 0;
    for(q=0;q<NQ;q++){ s += avg[p][q]; }
    overall[p] = s / NQ;
  }
  return {
    submitted: submitted.map(function(s){ return s.evaluator; }),
    raw: raw, avg: avg, cat: cat, overall: overall, voters: voters
  };
}

/* 同点は同順位（1,2,2,4 方式） */
function rankOf(values){
  var order = values.map(function(v,i){ return {v:v, i:i}; })
                    .sort(function(a,b){ return b.v - a.v; });
  var ranks = new Array(values.length);
  var lastV = null, lastR = 0;
  order.forEach(function(o, pos){
    var r = (lastV !== null && Math.abs(o.v - lastV) < 1e-9) ? lastR : pos + 1;
    ranks[o.i] = r; lastV = o.v; lastR = r;
  });
  return { ranks: ranks, order: order.map(function(o){ return o.i; }) };
}

/* ============================================================
   10. レーダーチャート（SVG）
   ============================================================ */

var SHAPES = ["circle","square","diamond"];

function markerPath(shape, x, y, s){
  if(shape === "square")  return '<rect x="'+(x-s)+'" y="'+(y-s)+'" width="'+(2*s)+'" height="'+(2*s)+'" rx="1"/>';
  if(shape === "diamond") return '<path d="M'+x+' '+(y-s*1.25)+'L'+(x+s*1.25)+' '+y+'L'+x+' '+(y+s*1.25)+'L'+(x-s*1.25)+' '+y+'Z"/>';
  return '<circle cx="'+x+'" cy="'+y+'" r="'+s+'"/>';
}

function radarSVG(series, opts){
  var o = opts || {};
  var w = o.w || 280, hh = o.h || 250, R = o.r || 72;
  var cx = w / 2, cy = hh / 2 + (o.dy || 0);
  var labelR = o.labelR || (R + 16);
  var n = CATS.length;
  var i, k;

  function pt(axis, value){
    var a = (-90 + axis * (360 / n)) * Math.PI / 180;
    var rr = R * (value / MAXPT);
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  }
  function poly(value){
    var d = [];
    for(i=0;i<n;i++){ var p = pt(i, value); d.push(p[0].toFixed(1) + "," + p[1].toFixed(1)); }
    return d.join(" ");
  }

  var s = '<svg class="radar-svg" viewBox="0 0 ' + w + ' ' + hh + '" role="img" aria-label="' +
          esc(series.map(function(x){ return x.name; }).join("、")) + 'のカテゴリ別スコア（10軸）">';

  /* 基準ゾーン。線ではなく面にすることで、目盛りと見分けがつく */
  s += '<polygon points="' + poly(BASELINE) + '" fill="var(--surface-3)" fill-opacity=".7" ' +
       'stroke="var(--axis)" stroke-width="1"/>';

  var rings = 4;
  for(k=1;k<=rings;k++){
    s += '<polygon points="' + poly(MAXPT * k / rings) + '" fill="none" stroke="var(--grid)" stroke-width="1"/>';
  }
  for(i=0;i<n;i++){
    var e = pt(i, MAXPT);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) +
         '" stroke="var(--grid)" stroke-width="1"/>';
  }

  series.forEach(function(ser){
    var pts = [], j;
    for(j=0;j<n;j++){ pts.push(pt(j, ser.values[j])); }
    var dstr = pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    s += '<polygon points="' + dstr + '" fill="' + ser.color + '" fill-opacity=".13" ' +
         'stroke="' + ser.color + '" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(function(p, j2){
      var tip = esc(ser.name) + " · " + esc(CATS[j2].short) + " " + fmt(ser.values[j2]) + "pt";
      s += '<g fill="' + ser.color + '" stroke="var(--surface)" stroke-width="2">' +
           markerPath(ser.shape || "circle", +p[0].toFixed(1), +p[1].toFixed(1), o.markerR || 4) +
           '</g>';
      s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="13" fill="transparent" ' +
           'data-tip="' + tip + '" style="cursor:default"/>';
    });
  });

  for(i=0;i<n;i++){
    var a = (-90 + i * (360 / n)) * Math.PI / 180;
    var lx = cx + Math.cos(a) * labelR, ly = cy + Math.sin(a) * labelR;
    var anchor = Math.cos(a) > 0.2 ? "start" : (Math.cos(a) < -0.2 ? "end" : "middle");
    var dy = Math.sin(a) > 0.5 ? 9 : (Math.sin(a) < -0.5 ? -3 : 4);
    s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + dy).toFixed(1) + '" text-anchor="' + anchor + '" ' +
         'font-size="' + (o.font || 10.5) + '" font-weight="600" fill="var(--ink-muted)" ' +
         'font-family="var(--font-ui)">' + esc(CATS[i].short) + '</text>';
  }
  s += '</svg>';
  return s;
}

var tipEl = document.getElementById("tip");
function showTip(target){
  var txt = target.getAttribute("data-tip");

  tipEl.textContent = txt;

}

   11. 回答タブ
   ============================================================ */

var A = { screen:"pick", evaluator:null, order:[], cat:0, key:null, auth:null, remote:null };

function blankOrder(){ return new Array(NQ).fill(null); }

function loadDraft(e, keyHex){
  var rec = lsGet(kDraft(e), null);
  if(!rec || !rec.enc) return blankOrder();
  var json = decryptStr(rec.enc, keyHex);
  if(json == null) return null;
  var order = blankOrder(), m = nRanked();
  try{
    var arr = JSON.parse(json);
    if(Array.isArray(arr)){
      for(var q=0;q<NQ;q++){
        var v = arr[q];
        if(Array.isArray(v) && v.length === m && v.every(function(x){ return x >= 0 && x < m; })){
          order[q] = v.slice();
        }
      }
    }
  }catch(err){ return null; }
  return order;
}
function saveDraft(){
  if(A.evaluator == null || !A.key) return;
  lsSet(kDraft(A.evaluator), { enc: encryptStr(JSON.stringify(A.order), A.key), at: Date.now() });
}
function hasDraft(e){ var r = lsGet(kDraft(e), null); return !!(r && r.enc); }
function storedAuth(e){ return lsGet(kAuth(e), null); }

function answeredCount(){
  var m = nRanked();
  return A.order.filter(function(o){ return o && o.length === m; }).length;
}
function catComplete(ci){
  var m = nRanked();
  for(var i=0;i<PER_CAT;i++){
    var o = A.order[ci * PER_CAT + i];
    if(!(o && o.length === m)) return false;
  }
  return true;
}
function submittedSet(){
  if(A.remote && A.remote.submitted) return A.remote.submitted;
  return Object.keys(getCodes()).map(Number);
}

function renderAnswer(){
  hideTip();
  if(!ROSTER) return renderSetup(false);
  if(A.screen === "pick") return renderPick();
  if(A.screen === "quiz") return renderQuiz();
  if(A.screen === "done") return renderDone();
}

function submitGate(person, isNew, alreadyDone){
  var pw = document.getElementById("gpw").value;
  var btn = document.getElementById("gate-go");
  if(pw.length < 4){ gateMsg("パスワードは4文字以上にしてください。", true); return; }
  if(isNew){
    var pw2 = document.getElementById("gpw2").value;
    if(pw !== pw2){ gateMsg("2つのパスワードが一致しません。", true); return; }
  }
  btn.disabled = true;
  gateMsg("確認中…", false);

  setTimeout(function(){
    var auth = deriveAuth(ROSTER.id, person, pw);
    var key  = deriveKey(ROSTER.id, person, pw);
    var known = storedAuth(person);

    if(known != null && known !== auth){
      btn.disabled = false; gateMsg("パスワードが違います。", true); return;
    }

    function proceed(){
      var order = blankOrder();
      if(hasDraft(person)){
        var loaded = loadDraft(person, key);
        if(loaded == null){
          btn.disabled = false; gateMsg("パスワードが違います。", true); return;
        }
        order = loaded;
      }
      if(alreadyDone){
        if(!confirm(personName(person) + " さんは提出済みです。\n最初から回答し直しますか？（前の回答は上書きされます）")){
          btn.disabled = false; gateMsg("", false); return;
        }
        var c = getCodes(); delete c[person]; lsSet(kCodes(), c);
        lsDel(kDraft(person));
        order = blankOrder();
        if(A.remote && A.remote.submitted){
          A.remote.submitted = A.remote.submitted.filter(function(x){ return x !== person; });
        }
      }
      lsSet(kAuth(person), auth);
      A.evaluator = person; A.key = key; A.auth = auth;
      A.order = order; A.cat = 0;
      for(var ci=0; ci<CATS.length; ci++){ if(!catComplete(ci)){ A.cat = ci; break; } }
      A.screen = "quiz";
      saveDraft();
      renderAnswer();
      window.scrollTo(0, 0);
    }

    if(known == null && syncOn()){
      syncCheck(person, auth).then(function(d){
        if(d.exists && !d.match){
          btn.disabled = false;
          gateMsg("この名前は別のパスワードで登録済みです。本人が設定したものを入れてください。", true);
          return;
        }
        proceed();
      }).catch(function(){ proceed(); });
    }else{
      proceed();
    }
  }, 30);
}

/* --- 11d. 質問 --------------------------------------------------------- */

function renderQuiz(){
  var me = A.evaluator;
  var tg = targets(me);
  var m = nRanked();
  var ci = A.cat;
  var cat = CATS[ci];
  var done = answeredCount();

  var railHtml = CATS.map(function(c, i){
    return '<button data-cat="' + i + '" data-full="' + (catComplete(i) ? 1 : 0) + '" ' +
           'aria-current="' + (i === ci ? "true" : "false") + '">' + esc(c.short) + '</button>';
  }).join("");

  var cardsHtml = cat.qs.map(function(qtext, qi){
    var qno = ci * PER_CAT + qi;
    var order = A.order[qno] || [];
    var complete = order.length === m;
    var chips = tg.map(function(personIdx, slot){
      var rank = order.indexOf(slot);
      var ranked = rank >= 0;
      return '<button class="chip" data-q="' + qno + '" data-slot="' + slot + '" data-ranked="' + (ranked ? 1 : 0) + '" ' +
             'aria-pressed="' + ranked + '">' +
               '<span class="chip-rank">' + (ranked ? (rank + 1) : "–") + '</span>' +
               '<span class="chip-name">' + esc(personName(personIdx)) + '</span>' +
               '<span class="chip-pt">' + (ranked ? PTS[rank] + "pt" : "") + '</span>' +
             '</button>';
    }).join("");
    var state = complete ? "done" : (order.length ? "partial" : "empty");
    return '<div class="qcard" data-state="' + state + '" id="q' + qno + '">' +
             '<div class="qcard-head">' +
               '<span class="qno">Q' + String(qno + 1).padStart(2, "0") + '</span>' +
               '<span class="qtext">' + esc(qtext) + '</span>' +
             '</div>' +
             '<div class="chips">' + chips + '</div>' +
             '<div class="qfoot">' +
               '<span class="xsmall muted">' + (complete
                 ? "回答済み"
                 : "上位から順にタップ（" + (m - 1) + "人選ぶと最後は自動で" + m + "位）") + '</span>' +
               (order.length ? '<button class="btn btn-ghost btn-sm" data-clear="' + qno + '" style="margin-left:auto">やり直す</button>' : "") +
             '</div>' +
           '</div>';
  }).join("");

  var isLast = ci === CATS.length - 1;
  var allDone = done === NQ;

  viewAnswer.innerHTML = "";
  viewAnswer.appendChild(h(
    '<div class="stack g16">' +
      '<div class="qbar"><div class="qbar-in">' +
        '<div class="row wrap g12" style="justify-content:space-between">' +
          '<div class="row g8">' +
            '<span class="pill pill-on"><span class="dot"></span>' + esc(personName(me)) + ' として回答中</span>' +
            '<button class="btn btn-ghost btn-sm" id="btn-switch">交代する</button>' +
          '</div>' +
          '<span class="num small dim">' + done + ' / ' + NQ + ' 問</span>' +
        '</div>' +
        '<div class="progress"><i style="width:' + (done / NQ * 100) + '%"></i></div>' +
        '<div class="catrail">' + railHtml + '</div>' +
      '</div></div>' +

      '<div class="stack g8">' +
        '<div class="sec-head">' +
          '<div><div class="eyebrow">Category ' + (ci + 1) + ' / ' + CATS.length + '</div><h2>' + esc(cat.name) + '</h2></div>' +
          '<p class="sec-note">' + esc(tg.map(function(i){ return personName(i); }).join("・")) +
          ' の' + m + '人を1位〜' + m + '位に並べてください。</p>' +
        '</div>' +
      '</div>' +

      '<div>' + cardsHtml + '</div>' +

      '<div class="qnav">' +
        '<button class="btn btn-ghost" id="btn-prev"' + (ci === 0 ? " disabled" : "") + '>← 前のカテゴリ</button>' +
        (isLast
          ? '<button class="btn btn-primary" id="btn-submit"' + (allDone ? "" : " disabled") + '>回答を確定して送信</button>'
          : '<button class="btn btn-primary" id="btn-next">次のカテゴリ →</button>') +
        (allDone && !isLast ? '<button class="btn" id="btn-finish">確定して送信</button>' : "") +
        (!allDone ? '<button class="btn btn-ghost" id="btn-jump" style="margin-left:auto">未回答へ移動（残り ' + (NQ - done) + '）</button>' : "") +
      '</div>' +
    '</div>'
  ));

  Array.prototype.forEach.call(viewAnswer.querySelectorAll(".chip"), function(b){
    b.addEventListener("click", function(){
      var q = +b.getAttribute("data-q"), slot = +b.getAttribute("data-slot");
      var cur = (A.order[q] || []).slice();
      var at = cur.indexOf(slot);
      if(at >= 0){
        cur.splice(at, 1);
      }else{
        cur.push(slot);
        if(cur.length === m - 1){
          for(var s2=0;s2<m;s2++){ if(cur.indexOf(s2) < 0){ cur.push(s2); break; } }
        }
      }
      A.order[q] = cur.length ? cur : null;
      saveDraft();
      renderQuiz();
      var card = document.getElementById("q" + q);
      if(card) card.scrollIntoView({ block:"nearest" });
    });
  });
  Array.prototype.forEach.call(viewAnswer.querySelectorAll("[data-clear]"), function(b){
    b.addEventListener("click", function(){
      A.order[+b.getAttribute("data-clear")] = null;
      saveDraft(); renderQuiz();
    });
  });
  Array.prototype.forEach.call(viewAnswer.querySelectorAll("[data-cat]"), function(b){
    b.addEventListener("click", function(){
      A.cat = +b.getAttribute("data-cat"); renderQuiz(); window.scrollTo(0, 0);
    });
  });

  var el;
  if((el = document.getElementById("btn-prev")))  el.addEventListener("click", function(){ A.cat = Math.max(0, ci - 1); renderQuiz(); window.scrollTo(0,0); });
  if((el = document.getElementById("btn-next")))  el.addEventListener("click", function(){ A.cat = Math.min(CATS.length - 1, ci + 1); renderQuiz(); window.scrollTo(0,0); });
  if((el = document.getElementById("btn-switch")))el.addEventListener("click", function(){ A.screen = "pick"; renderAnswer(); window.scrollTo(0,0); });
  if((el = document.getElementById("btn-jump")))  el.addEventListener("click", function(){
    for(var q=0;q<NQ;q++){
      if(!(A.order[q] && A.order[q].length === m)){
        var c2 = QUESTIONS[q].cat;
        if(c2 !== A.cat){ A.cat = c2; renderQuiz(); }
        var t = document.getElementById("q" + q);
        if(t) t.scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
    }
  });

  function submit(ev){
    if(answeredCount() !== NQ) return;
    var code = encodeCode(A.evaluator, A.order);
    var btn = ev && ev.currentTarget;

    function finish(sent, errText){
      saveCode(A.evaluator, code);
      lsDel(kDraft(A.evaluator));
      if(A.remote && A.remote.submitted && A.remote.submitted.indexOf(A.evaluator) < 0){
        A.remote.submitted.push(A.evaluator);
      }
      A.screen = "done"; A.code = code; A.sent = sent; A.sendError = errText || null;
      renderAnswer(); window.scrollTo(0, 0);
    }
    if(syncOn()){
      if(btn){ btn.disabled = true; btn.textContent = "送信中…"; }
      syncSubmit(A.evaluator, code, A.auth)
        .then(function(){ finish(true); })
        .catch(function(err){ finish(false, syncErrorText(err)); });
    }else{
      finish(false);
    }
  }
  if((el = document.getElementById("btn-submit"))) el.addEventListener("click", submit);
  if((el = document.getElementById("btn-finish"))) el.addEventListener("click", submit);
}

/* --- 11e. 送信完了 ----------------------------------------------------- */

function renderDone(){
  var code = A.code, sent = A.sent;
  var showCode = !sent;
  var n = submittedSet().length, N = nPeople();

  viewAnswer.innerHTML = "";
  viewAnswer.appendChild(h(
    '<div class="stack g24">' +
      '<section class="stack g12">' +
        '<div class="eyebrow">Submitted</div>' +
        '<h1 style="font-size:28px">' + esc(personName(A.evaluator)) + ' さんの回答を受け付けました</h1>' +
        '<p class="hero-lede">' +
          (sent
            ? '集計に反映されました。もう何もしなくて大丈夫です。'
            : (syncOn()
                ? 'ただし自動送信には失敗しました。下のコードを集計担当に送ってください。'
                : '下の回答コードを集計担当の人に送ってください。この端末で集計する場合は送らなくて大丈夫です。')) +
        '</p>' +
      '</section>' +
      (sent
        ? '<div class="notice"><b>' + n + ' / ' + N + '人</b> が提出済みです。' +
          '全員そろったら、集計担当が「結果を見る」から結果を開けます。</div>'
        : "") +
      (A.sendError ? '<div class="notice notice-crit">' + esc(A.sendError) + '</div>' : "") +
      (showCode
        ? '<div class="card pad stack g12">' +
            '<div class="row g8" style="justify-content:space-between">' +
              '<span class="eyebrow">回答コード</span>' +
              '<button class="btn btn-sm" id="btn-copy">コピー</button>' +
            '</div>' +
            '<div class="codebox" id="codebox">' + esc(groupCode(code)) + '</div>' +
            '<p class="xsmall muted">スペースは読みやすさのためのものです。含めても含めなくても読み込めます。</p>' +
          '</div>'
        : "") +
      (!sent && syncOn()
        ? '<div class="row g8 wrap"><button class="btn btn-primary" id="btn-retry">もう一度送信する</button></div>'
        : "") +
      '<div class="row g8 wrap">' +
        '<button class="btn btn-ghost" id="btn-back">最初の画面に戻る</button>' +
      '</div>' +
    '</div>'
  ));

  var el;
  if((el = document.getElementById("btn-copy"))) el.addEventListener("click", function(){ copyText(code, this); });
  if((el = document.getElementById("btn-retry"))) el.addEventListener("click", function(){
    var b = this; b.disabled = true; b.textContent = "送信中…";
    syncSubmit(A.evaluator, code, A.auth).then(function(){
      A.sent = true; A.sendError = null; renderAnswer(); window.scrollTo(0,0);
    }).catch(function(err){
      A.sendError = syncErrorText(err); renderAnswer();
    });
  });
  document.getElementById("btn-back").addEventListener("click", function(){
    A.screen = "pick"; A.evaluator = null; A.key = null; A.auth = null;
    renderAnswer(); window.scrollTo(0,0);
  });
}

function copyText(text, btn){
  var label = btn.textContent;
  function ok(){ btn.textContent = "コピーしました"; setTimeout(function(){ btn.textContent = label; }, 1600); }
  function ng(){ btn.textContent = "手動で選択してください"; setTimeout(function(){ btn.textContent = label; }, 2200); }
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var okc = document.execCommand("copy");
      document.body.removeChild(ta);
      okc ? ok() : ng();
    }catch(e){ ng(); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  }else{ fallback(); }
}

/* ============================================================
   12. 結果タブ
   ============================================================ */

var R = { unlocked:false, compare:[0,1,2], fetched:null };

function renderResult(){
  hideTip();
  if(!ROSTER){
    viewResult.innerHTML = "";
    viewResult.appendChild(h('<div class="notice notice-warn">先に「回答する」タブで参加者を設定してください。</div>'));
    return;
  }
  if(!R.unlocked) return renderLock();
  return renderDashboard();
}

function renderLock(){
  viewResult.innerHTML = "";
  viewResult.appendChild(h(
    '<div class="stack g24">' +
      '<section class="stack g12">' +
        '<div class="eyebrow">Protected</div>' +
        '<h1 style="font-size:28px">集計結果はパスワードで保護されています</h1>' +
        '<p class="hero-lede">回答した人が途中で結果を覗けないように、集計画面はパスワードの後ろにあります。</p>' +
      '</section>' +
      '<form class="card pad stack g12 lock" id="lockform">' +
        '<label class="eyebrow" for="pw">パスワード</label>' +
        '<input class="field" type="password" id="pw" autocomplete="current-password" placeholder="••••••••••">' +
        '<div class="row g8"><button class="btn btn-primary" type="submit">結果を開く</button></div>' +
        '<p class="xsmall muted" id="pwmsg"></p>' +
      '</form>' +
    '</div>'
  ));
  document.getElementById("lockform").addEventListener("submit", function(ev){
    ev.preventDefault();
    if(document.getElementById("pw").value === PASSWORD){
      try{ sessionStorage.setItem(K_UNLOCK, "1"); }catch(e){}
      R.unlocked = true; renderResult(); window.scrollTo(0,0);
    }else{
      var m = document.getElementById("pwmsg");
      m.textContent = "パスワードが違います。もう一度入力してください。";
      m.style.color = "var(--crit)";
      document.getElementById("pw").select();
    }
  });
}

function renderDashboard(){
  var codes = getCodes();
  var agg = aggregate(codes);
  var nSub = agg.submitted.length;
  var N = nPeople();

  if(syncOn() && !R.fetched){
    R.fetched = "loading";
    syncList().then(function(d){
      var got = 0;
      (d.rows || []).forEach(function(row){
        var dec = decodeCode(row.code);
        if(!dec.error){ saveCode(dec.evaluator, dec.code); got++; }
      });
      R.fetched = { ok:true, got:got, at:new Date() };
      renderDashboard();
    }).catch(function(err){
      R.fetched = { ok:false, error:syncErrorText(err) };
      renderDashboard();
    });
  }

  viewResult.innerHTML = "";
  var root = h('<div class="stack g40"></div>');
  viewResult.appendChild(root);

  /* 全員そろうまでは集計しない。
     途中経過が見えると、まだ回答していない人がそれに合わせて順位を変えられる。 */
  if(nSub < N){
    root.appendChild(secWaiting(agg, nSub));
    root.appendChild(secSubmissions(codes, agg));
    root.appendChild(secAdmin());
    bindSubmissions();
    bindAdmin();
    return;
  }

  root.appendChild(secSubmissions(codes, agg));
  root.appendChild(secOverall(agg));
  root.appendChild(secRadars(agg));
  root.appendChild(secCompare(agg));
  root.appendChild(secCategoryTable(agg));
  root.appendChild(secQuestions(agg));
  root.appendChild(secRawTable(agg));
  root.appendChild(secAdmin());

  bindSubmissions();
  bindCompare(agg);
  bindAdmin();
}

function secWaiting(agg, nSub){
  var N = nPeople(), missing = [];
  ROSTER.names.forEach(function(n, i){ if(agg.submitted.indexOf(i) < 0) missing.push(n); });
  var loading = R.fetched === "loading";

  return h(
    '<section class="stack g16">' +
      '<div class="card pad hero">' +
        '<div class="stack g8">' +
          '<span class="eyebrow">Locked</span>' +
          '<span class="hero-fig">' + nSub +
            '<span style="font-size:26px;font-weight:700;color:var(--ink-muted)"> / ' + N + '</span></span>' +
          '<span class="small muted">提出済み</span>' +
        '</div>' +
        '<div class="stack g12">' +
          '<h2 style="font-size:20px">' + N + '人そろうまで結果は表示されません</h2>' +
          '<p class="sec-note">途中経過が見えると、まだ回答していない人がそれに合わせて順位を変えられてしまいます。' +
          '全員の回答が届くまで、集計もランキングも出しません。</p>' +
          '<div class="progress"><i style="width:' + (nSub / N * 100) + '%"></i></div>' +
          (loading
            ? '<p class="small muted">サーバーから取得中…</p>'
            : (missing.length ? '<p class="small dim">未提出：<b>' + esc(missing.join("、")) + '</b></p>' : "")) +
        '</div>' +
      '</div>' +
    '</section>'
  );
}

function secSubmissions(codes, agg){
  var chips = ROSTER.names.map(function(name, i){
    var ok = agg.submitted.indexOf(i) >= 0;
    return '<span class="pill ' + (ok ? "pill-done" : "") + '"><span class="dot"></span>' +
           esc(name) + ' ' + (ok ? "提出済み" : "未提出") + '</span>';
  }).join("");

  var syncBlock = "";
  if(syncOn()){
    var f = R.fetched;
    var statusHtml =
      (f === "loading" || !f) ? '<span class="muted">サーバーから取得中…</span>'
      : (f.ok ? '<span class="pill pill-done"><span class="dot"></span>自動取得 ' + f.got + '件 · ' +
                f.at.toLocaleTimeString("ja-JP") + '</span>'
              : '<span class="pill pill-crit"><span class="dot"></span>取得できませんでした</span>');
    syncBlock =
      '<div class="card pad stack g12">' +
        '<div class="row wrap g8" style="justify-content:space-between">' +
          '<span class="eyebrow">自動集計</span>' + statusHtml +
        '</div>' +
        '<p class="small dim">回答は送信された時点でここに集まります。コードのやりとりは不要です。</p>' +
        (f && !f.ok ? '<div class="notice notice-crit">' + esc(f.error) + '</div>' : "") +
        '<div class="row g8 wrap"><button class="btn btn-sm" id="btn-refetch">最新を取得しなおす</button></div>' +
      '</div>';
  }

  return h(
    '<section class="stack g12">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 1</div><h2>回答を集める</h2></div>' +
        '<p class="sec-note">' + (syncOn()
          ? '回答は自動で集まります。下の手入力はサーバーが使えないときの予備です。'
          : '各自の回答コードを貼り付けます。改行で区切れば何件でもまとめて読み込めます。') + '</p>' +
      '</div>' +
      '<div class="row wrap g8">' + chips + '</div>' +
      syncBlock +
      '<details class="qgroup"' + (syncOn() ? "" : " open") + '>' +
        '<summary>回答コードを手で読み込む</summary>' +
        '<div class="qgroup-body"><div class="stack g12">' +
          '<textarea class="field" id="codein" placeholder="PR2 で始まる' + codeLength(nRanked()) + '文字のコードを貼り付け（複数行可）"></textarea>' +
          '<div class="row wrap g8">' +
            '<button class="btn btn-primary btn-sm" id="btn-load">読み込む</button>' +
          '</div>' +
          '<div id="loadmsg"></div>' +
        '</div></div>' +
      '</details>' +
    '</section>'
  );
}

function bindSubmissions(){
  var btn = document.getElementById("btn-load");
  if(btn) btn.addEventListener("click", function(){
    var raw = document.getElementById("codein").value;
    var lines = raw.split(/[\r\n]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(!lines.length){ msg('<div class="notice notice-warn">コードが入力されていません。</div>'); return; }
    var okList = [], errList = [];
    lines.forEach(function(line, i){
      var d = decodeCode(line);
      if(d.error){ errList.push((i + 1) + "行目：" + d.error); }
      else{ saveCode(d.evaluator, d.code); okList.push(personName(d.evaluator)); }
    });
    var out = "";
    if(okList.length) out += '<div class="notice"><b>' + okList.length + '件</b>読み込みました：' + esc(okList.join("、")) + '</div>';
    if(errList.length) out += '<div class="notice notice-crit">' + errList.map(esc).join("<br>") + '</div>';
    msg(out);
    if(okList.length){ setTimeout(function(){ renderDashboard(); window.scrollTo(0,0); }, 700); }
  });

  var rf = document.getElementById("btn-refetch");
  if(rf) rf.addEventListener("click", function(){ R.fetched = null; renderDashboard(); window.scrollTo(0, 0); });

  function msg(html){ var m = document.getElementById("loadmsg"); if(m) m.innerHTML = html; }
}

function secOverall(agg){
  var rk = rankOf(agg.overall);
  var winner = rk.order[0];
  var rows = rk.order.map(function(p){
    var v = agg.overall[p];
    var total = agg.raw[p].reduce(function(a,b){ return a + b; }, 0);
    return rankRow(rk.ranks[p], personName(p), v / MAXPT, fmt(v) + " pt", "合計 " + total + "pt");
  }).join("");

  return h(
    '<section class="stack g16">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 2 · Overall</div><h2>総合ランキング</h2></div>' +
        '<p class="sec-note">全' + NQ + '問の平均。0〜' + ptText(MAXPT) + 'ptで、' +
        ptText(BASELINE) + 'ptが「この人数の中で平均的」の目安です。</p>' +
      '</div>' +
      '<div class="card pad hero">' +
        '<div class="stack g8">' +
          '<span class="eyebrow">総合1位</span>' +
          '<span class="hero-name">' + esc(personName(winner)) + '</span>' +
          '<span class="hero-fig">' + fmt(agg.overall[winner]) + '</span>' +
          '<span class="small muted">平均pt（満点' + fmt(MAXPT) + '・基準' + ptText(BASELINE) + '）</span>' +
        '</div>' +
        '<div class="rank-list">' + rows + '</div>' +
      '</div>' +
    '</section>'
  );
}

function rankRow(rank, name, frac, main, sub){
  return '<div class="rank-row">' +
    '<span class="rank-badge" data-top="' + (rank === 1 ? 1 : 0) + '">' + rank + '</span>' +
    '<span class="rank-name">' + esc(name) + '</span>' +
    '<span class="bar-track"><span class="bar-fill" style="width:' + Math.max(0, Math.min(100, frac * 100)).toFixed(1) + '%"></span></span>' +
    '<span class="rank-val"><b>' + main + '</b>' + (sub ? ' <span class="muted">' + sub + '</span>' : "") + '</span>' +
  '</div>';
}

function secRadars(agg){
  var cells = ROSTER.names.map(function(name, p){
    var svg = radarSVG(
      [{ name:name, values:agg.cat[p], color:"var(--s1)", shape:"circle" }],
      { w:280, h:248, r:72, labelR:90, markerR:4 }
    );
    return '<div class="radar-cell">' +
      '<div class="radar-cap"><span class="n">' + esc(name) + '</span>' +
      '<span class="v">平均 ' + fmt(agg.overall[p]) + 'pt</span></div>' + svg + '</div>';
  }).join("");

  return h(
    '<section class="stack g16">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 3 · Profile</div><h2>カテゴリ別レーダー</h2></div>' +
        '<p class="sec-note">10カテゴリの平均pt。外側の輪が' + fmt(MAXPT) + 'pt、中央の薄いゾーンが基準の' +
        ptText(BASELINE) + 'ptより内側です。ゾーンから外に膨らんでいるところが、その人の強みとして評価されています。</p>' +
      '</div>' +
      '<div class="radar-grid">' + cells + '</div>' +
      '<p class="xsmall muted">軸ラベルの正式名称：' +
        CATS.map(function(c){ return esc(c.short) + "＝" + esc(c.name); }).join(" ／ ") +
      '</p>' +
    '</section>'
  );
}

function secCompare(agg){
  var sel = R.compare.filter(function(p){ return p < nPeople(); }).slice(0, 3);
  var series = sel.map(function(p, i){
    return { name:personName(p), values:agg.cat[p], color:"var(--s" + (i + 1) + ")", shape:SHAPES[i] };
  });

  var picks = ROSTER.names.map(function(name, p){
    var on = sel.indexOf(p) >= 0;
    var style = on ? ' style="color:var(--s' + (sel.indexOf(p) + 1) + ')"' : "";
    var disabled = (!on && sel.length >= 3) ? " disabled" : "";
    return '<button class="pick" data-cmp="' + p + '" aria-pressed="' + on + '"' + style + disabled + '>' +
      (on ? '<span class="legend-swatch" data-shape="' + SHAPES[sel.indexOf(p)] + '"></span>' : "") +
      esc(name) + '</button>';
  }).join("");

  var legend = series.map(function(s){
    return '<span class="legend-item" style="color:' + s.color + '">' +
      '<span class="legend-swatch" data-shape="' + s.shape + '"></span>' +
      '<span style="color:var(--ink)">' + esc(s.name) + '</span></span>';
  }).join("");

  var head = '<tr><th>カテゴリ</th>' + series.map(function(s){ return '<th>' + esc(s.name) + '</th>'; }).join("") + '</tr>';
  var body = CATS.map(function(c, ci){
    var vals = series.map(function(s){ return s.values[ci]; });
    var best = Math.max.apply(null, vals);
    return '<tr><td>' + esc(c.name) + '</td>' +
      vals.map(function(v){
        return '<td class="n' + (Math.abs(v - best) < 1e-9 ? " top" : "") + '">' + fmt(v) + '</td>';
      }).join("") + '</tr>';
  }).join("");

  return h(
    '<section class="stack g16">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 4 · Compare</div><h2>重ねて比べる</h2></div>' +
        '<p class="sec-note">重ねられるのは3人までです。4人以上を1枚に重ねると、色覚のタイプによっては線が見分けられなくなるためです。</p>' +
      '</div>' +
      '<div class="pick-row">' + picks + '</div>' +
      (series.length
        ? '<div class="card pad"><div class="cmp-layout">' +
            '<div class="cmp-chart">' +
              '<div class="legend">' + legend + '</div>' +
              radarSVG(series, { w:420, h:390, r:126, labelR:150, font:12, markerR:4.5 }) +
              '<p class="xsmall muted">中央の薄いゾーンは基準（' + ptText(BASELINE) + 'pt）より内側。外周が' + fmt(MAXPT) + 'ptです。</p>' +
            '</div>' +
            '<div class="scrollx"><table class="data"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
          '</div></div>'
        : '<div class="notice">比べたい人を選んでください（最大3人）。</div>') +
    '</section>'
  );
}

function bindCompare(agg){
  Array.prototype.forEach.call(viewResult.querySelectorAll("[data-cmp]"), function(b){
    b.addEventListener("click", function(){
      var p = +b.getAttribute("data-cmp");
      var at = R.compare.indexOf(p);
      if(at >= 0) R.compare.splice(at, 1);
      else if(R.compare.length < 3) R.compare.push(p);
      renderDashboard();
      var s = viewResult.querySelector("[data-cmp]");
      if(s) s.scrollIntoView({ block:"center" });
    });
  });
}

function secCategoryTable(agg){
  var head = '<tr><th>カテゴリ</th>' + ROSTER.names.map(function(n){ return '<th>' + esc(n) + '</th>'; }).join("") + '<th>1位</th></tr>';
  var body = CATS.map(function(c, ci){
    var vals = ROSTER.names.map(function(_, p){ return agg.cat[p][ci]; });
    var rk = rankOf(vals);
    var winners = ROSTER.names.filter(function(_, p){ return rk.ranks[p] === 1; });
    return '<tr><td>' + esc(c.name) + '</td>' +
      vals.map(function(v, p){
        return '<td class="n' + (rk.ranks[p] === 1 ? " top" : "") + '">' + fmt(v) +
               ' <span class="muted xsmall">(' + rk.ranks[p] + '位)</span></td>';
      }).join("") +
      '<td>' + esc(winners.join("・")) + '</td></tr>';
  }).join("");

  var totals = ROSTER.names.map(function(_, p){ return agg.overall[p]; });
  var trk = rankOf(totals);
  var foot = '<tr><td><b>総合</b></td>' + totals.map(function(v, p){
    return '<td class="n' + (trk.ranks[p] === 1 ? " top" : "") + '"><b>' + fmt(v) + '</b> <span class="muted xsmall">(' + trk.ranks[p] + '位)</span></td>';
  }).join("") + '<td>' + esc(ROSTER.names.filter(function(_, p){ return trk.ranks[p] === 1; }).join("・")) + '</td></tr>';

  return h(
    '<section class="stack g16">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 5 · Table</div><h2>カテゴリ別ランキング</h2></div>' +
        '<p class="sec-note">評価者1人あたりの平均pt（0〜' + ptText(MAXPT) + '）と、その中での順位。</p>' +
      '</div>' +
      '<div class="card pad"><div class="scrollx"><table class="data">' +
        '<thead>' + head + '</thead><tbody>' + body + foot + '</tbody>' +
      '</table></div></div>' +
    '</section>'
  );
}

function secQuestions(agg){
  var groups = CATS.map(function(c, ci){
    var blocks = c.qs.map(function(qtext, qi){
      var qno = ci * PER_CAT + qi;
      var vals = ROSTER.names.map(function(_, p){ return agg.avg[p][qno]; });
      var rk = rankOf(vals);
      var rows = rk.order.map(function(p){
        return rankRow(rk.ranks[p], personName(p), vals[p] / MAXPT, fmt(vals[p]) + " pt", "合計 " + agg.raw[p][qno] + "pt");
      }).join("");
      return '<div>' +
        '<div class="qblock-title"><span class="qno">Q' + String(qno + 1).padStart(2, "0") + '</span>' + esc(qtext) + '</div>' +
        '<div class="rank-list">' + rows + '</div>' +
      '</div>';
    }).join("");

    var catVals = ROSTER.names.map(function(_, p){ return agg.cat[p][ci]; });
    var top = rankOf(catVals).order[0];

    return '<details class="qgroup"' + (ci === 0 ? " open" : "") + '>' +
      '<summary>' + esc(c.name) +
        '<span class="pill" style="margin-left:auto;font-weight:600">総合1位 ' + esc(personName(top)) + '</span>' +
      '</summary>' +
      '<div class="qgroup-body">' + blocks + '</div>' +
    '</details>';
  }).join("");

  return h(
    '<section class="stack g16">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 6 · Detail</div><h2>質問別ランキング（全' + NQ + '問）</h2></div>' +
        '<p class="sec-note">1問ごとの順位。「平均pt」は評価者1人あたり、「合計pt」は全評価者の素点です。' +
        '1問で配られる合計は ' + (PTS_SUM * nPeople()) + 'pt（' + PTS_SUM + 'pt × ' + nPeople() + '人）です。</p>' +
      '</div>' +
      '<div>' + groups + '</div>' +
    '</section>'
  );
}

function secRawTable(agg){
  var head = '<tr><th>#</th><th>カテゴリ</th><th>質問</th>' +
             ROSTER.names.map(function(n){ return '<th>' + esc(n) + '</th>'; }).join("") + '</tr>';
  var body = QUESTIONS.map(function(q){
    var vals = ROSTER.names.map(function(_, p){ return agg.avg[p][q.no]; });
    var rk = rankOf(vals);
    return '<tr><td class="n">' + (q.no + 1) + '</td><td>' + esc(CATS[q.cat].short) + '</td><td>' + esc(q.text) + '</td>' +
      vals.map(function(v, p){
        return '<td class="n' + (rk.ranks[p] === 1 ? " top" : "") + '">' + fmt(v) + '</td>';
      }).join("") + '</tr>';
  }).join("");

  var tsv = ["#\tカテゴリ\t質問\t" + ROSTER.names.join("\t")];
  QUESTIONS.forEach(function(q){
    tsv.push((q.no + 1) + "\t" + CATS[q.cat].name + "\t" + q.text + "\t" +
      ROSTER.names.map(function(_, p){ return fmt(agg.avg[p][q.no]); }).join("\t"));
  });
  tsv.push("");
  tsv.push("カテゴリ平均\t\t\t");
  CATS.forEach(function(c, ci){
    tsv.push(c.name + "\t\t\t" + ROSTER.names.map(function(_, p){ return fmt(agg.cat[p][ci]); }).join("\t"));
  });
  tsv.push("総合\t\t\t" + ROSTER.names.map(function(_, p){ return fmt(agg.overall[p]); }).join("\t"));

  var sec = h(
    '<section class="stack g16">' +
      '<div class="sec-head">' +
        '<div><div class="eyebrow">Step 7 · Data</div><h2>全データ</h2></div>' +
        '<p class="sec-note">グラフに出ている数字はすべてここにあります。表計算ソフトに貼り付けられる形式でも出せます。</p>' +
      '</div>' +
      '<div class="card pad stack g12">' +
        '<div class="scrollx" style="max-height:460px;overflow-y:auto">' +
          '<table class="data"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
        '</div>' +
        '<div class="row g8 wrap">' +
          '<button class="btn btn-ghost btn-sm" id="btn-tsv">貼り付け用テキストを表示</button>' +
        '</div>' +
        '<textarea class="field hidden" id="tsvbox" rows="10" readonly></textarea>' +
      '</div>' +
    '</section>'
  );

  setTimeout(function(){
    var b = document.getElementById("btn-tsv");
    if(!b) return;
    b.addEventListener("click", function(){
      var t = document.getElementById("tsvbox");
      if(t.classList.contains("hidden")){
        t.value = tsv.join("\n");
        t.classList.remove("hidden"); t.select();
        this.textContent = "テキストを隠す";
      }else{
        t.classList.add("hidden");
        this.textContent = "貼り付け用テキストを表示";
      }
    });
  }, 0);

  return sec;
}

function secAdmin(){
  var resetRow = syncOn()
    ? '<div class="stack g8">' +
        '<span class="eyebrow">パスワードを忘れた人がいるとき</span>' +
        '<p class="small dim">その人の登録を消すと、本人が新しいパスワードで回答をやり直せます。提出済みの回答も消えます。</p>' +
        '<div class="row g8 wrap">' +
          ROSTER.names.map(function(n, i){
            return '<button class="btn btn-ghost btn-sm" data-reset="' + i + '">' + esc(n) + 'をリセット</button>';
          }).join("") +
        '</div>' +
        '<p class="xsmall" id="resetmsg"></p>' +
      '</div><hr class="hr">'
    : "";

  return h(
    '<section class="stack g12 no-print">' +
      '<div class="sec-head"><div><div class="eyebrow">Admin</div><h2>管理</h2></div></div>' +
      '<div class="card pad stack g12">' +
        '<div class="stack g8">' +
          '<span class="eyebrow">いまの設定</span>' +
          '<p class="small dim">' + nPeople() + '人（' + esc(ROSTER.names.join("・")) + '）／ 配点 ' +
          PTS.join("-") + ' ／ 名簿ID <span class="num">' + esc(ROSTER.id) + '</span></p>' +
        '</div><hr class="hr">' +
        resetRow +
        '<p class="small dim">この端末に残っている下書きと回答コードを消します。' +
        (syncOn() ? 'サーバー側のデータは消えません。' : '消すと元に戻せません。') + '</p>' +
        '<div class="row g8 wrap">' +
          '<button class="btn btn-ghost btn-sm" id="btn-wipe">この端末の保存データを消去</button>' +
          '<button class="btn btn-ghost btn-sm" id="btn-lock">結果をロックする</button>' +
        '</div>' +
      '</div>' +
    '</section>'
  );
}

function bindAdmin(){
  var w = document.getElementById("btn-wipe");
  if(w) w.addEventListener("click", function(){
    if(!confirm("この端末に保存された回答コード・下書き・パスワード設定を消去します。よろしいですか？")) return;
    lsDel(kCodes());
    for(var i=0;i<nPeople();i++){ lsDel(kDraft(i)); lsDel(kAuth(i)); }
    R.fetched = null; A.remote = null;
    renderDashboard(); renderAnswer(); window.scrollTo(0,0);
  });
  var l = document.getElementById("btn-lock");
  if(l) l.addEventListener("click", function(){
    try{ sessionStorage.removeItem(K_UNLOCK); }catch(e){}
    R.unlocked = false; renderResult(); window.scrollTo(0,0);
  });
  Array.prototype.forEach.call(viewResult.querySelectorAll("[data-reset]"), function(b){
    b.addEventListener("click", function(){
      var i = +b.getAttribute("data-reset");
      if(!confirm(personName(i) + " さんの登録と提出済みの回答を消します。よろしいですか？")) return;
      var m = document.getElementById("resetmsg");
      b.disabled = true;
      syncReset(i).then(function(){
        var c = getCodes(); delete c[i]; lsSet(kCodes(), c);
        lsDel(kDraft(i)); lsDel(kAuth(i));
        A.remote = null; R.fetched = null;
        if(m){ m.textContent = personName(i) + " さんをリセットしました。"; m.style.color = "var(--good)"; }
        setTimeout(function(){ renderDashboard(); window.scrollTo(0,0); }, 800);
      }).catch(function(err){
        b.disabled = false;
        if(m){ m.textContent = syncErrorText(err); m.style.color = "var(--crit)"; }
      });
    });
  });
}

/* ============================================================
   13. タブと起動
   ============================================================ */

var tabAnswer = document.getElementById("tab-answer");
var tabResult = document.getElementById("tab-result");

function setTab(which){
  var isAnswer = which === "answer";
  tabAnswer.setAttribute("aria-selected", String(isAnswer));
  tabResult.setAttribute("aria-selected", String(!isAnswer));
  viewAnswer.classList.toggle("hidden", !isAnswer);
  viewResult.classList.toggle("hidden", isAnswer);
  if(isAnswer) renderAnswer(); else renderResult();
  window.scrollTo(0, 0);
}
tabAnswer.addEventListener("click", function(){ setTab("answer"); });
tabResult.addEventListener("click", function(){ setTab("result"); });

/* 質問バーは上のバーの下に貼り付く。上のバーは折り返すと高くなる */
(function trackTopbar(){
  var bar = document.querySelector(".topbar");
  function measure(){
    document.documentElement.style.setProperty("--topbar-h", bar.offsetHeight + "px");
  }
  measure();
  if(window.ResizeObserver) new ResizeObserver(measure).observe(bar);
  else window.addEventListener("resize", measure);
})();

/* ホーム画面アプリとして使えるようにする。
   file:// で開いた場合や未対応ブラウザでは黙って何もしない（動作には影響しない） */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

try{ R.unlocked = sessionStorage.getItem(K_UNLOCK) === "1"; }catch(e){}

/* 名簿の決定順：招待リンク → この端末の記録 → サーバー */
(function bootRoster(){
  var fromHash = rosterFromHash();
  var stored = lsGet(K_ROSTER, null);

  if(fromHash){
    applyRoster(fromHash);
    lsSet(K_ROSTER, fromHash);
  }else if(stored && stored.names && stored.id){
    applyRoster(stored);
  }
  renderAnswer();

  if(syncOn()){
    syncGetRoster().then(function(d){
      if(!d.names || !d.names.length) {
        /* サーバーが空なら、この端末の名簿を登録しておく */
        if(ROSTER) syncSetRoster().catch(function(){});
        return;
      }
      var server = makeRoster(d.names, d.scale === "linear" ? "linear" : "double");
      if(!ROSTER || server.id !== ROSTER.id){
        applyRoster(server);
        lsSet(K_ROSTER, server);
        A = { screen:"pick", evaluator:null, order:[], cat:0, key:null, auth:null, remote:null };
        R.fetched = null;
        renderAnswer();
        if(R.unlocked) renderResult();
      }
    }).catch(function(){});
  }
})();

})();
</script>
